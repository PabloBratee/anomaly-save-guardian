<?xml version="1.0" encoding="UTF-8"?>
<!-- Anomaly Save Guardian app icon (design source).
     A protective shield with a circular restore/backup arrow in the app's
     radioactive-green accent on a dark tile. The runtime .ico is generated by
     assets/build-icon.ps1; this SVG is the matching vector reference. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272b33"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aae662"/>
      <stop offset="1" stop-color="#68a838"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded tile: keeps the shield readable on light or dark backgrounds -->
  <rect x="11.52" y="11.52" width="232.96" height="232.96" rx="55" fill="url(#tile)"/>
  <rect x="11.52" y="11.52" width="232.96" height="232.96" rx="55" fill="none"
        stroke="#465062" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Shield -->
  <path d="M 55.04 76.8
           A 21.76 21.76 0 0 1 76.8 55.04
           L 179.2 55.04
           A 21.76 21.76 0 0 1 200.96 76.8
           L 200.96 126.72
           C 200.96 184.32 161.56 213.76 128 218.88
           C 94.44 213.76 55.04 184.32 55.04 126.72
           Z"
        fill="url(#shield)"/>
  <path d="M 55.04 76.8
           A 21.76 21.76 0 0 1 76.8 55.04
           L 179.2 55.04
           A 21.76 21.76 0 0 1 200.96 76.8
           L 200.96 126.72
           C 200.96 184.32 161.56 213.76 128 218.88
           C 94.44 213.76 55.04 184.32 55.04 126.72
           Z"
        fill="none" stroke="#427026" stroke-width="5.6" stroke-linejoin="round"/>

  <!-- Circular restore arrow, engraved dark into the shield -->
  <g fill="none" stroke="#171a21" stroke-width="18.43" stroke-linecap="round">
    <path d="M 147.84 97.48 A 39.68 39.68 0 1 1 88.92 124.95"/>
  </g>
  <polygon points="61.54,125.38 114.5,134.72 94.92,90.91" fill="#171a21"/>
</svg>
